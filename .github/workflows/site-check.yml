name: Site Health Check

# Cloudflare Pages serves its 404 page with a 200 status, so a missing asset,
# a stale internal link, or a form pointing at a retired endpoint fails
# silently in production. quiz.html posted leads to a dead Formspree endpoint
# for weeks before anyone noticed. This runs before that can happen again.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Catches what `node --check` cannot: code that is valid grammar but
      # refers to something that no longer exists. A refactor once left
      # REFERRAL_FEE behind as a free variable and every other check passed.
      - name: Install dev tooling
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Validate links, assets, forms, SEO and structured data
        run: node .github/scripts/check-site.js

      - name: Validate sitemap XML
        run: |
          python3 -c "import xml.dom.minidom as m; m.parse('sitemap.xml'); print('sitemap.xml: valid XML')"

      # -print0 because this word-split on any path containing a space. It
      # passed only because no tracked .js path has one; the untracked saved
      # page under Images/ breaks it immediately.
      - name: Syntax-check JavaScript
        run: |
          find . -name '*.js' -not -path './node_modules/*' -not -path './.github/*' \
            -not -path './.harness/*' -print0 |
          while IFS= read -r -d '' f; do node --check "$f" || exit 1; done
          echo "all JS parses"

      # node --check cannot see inside a template literal, so the dashboard's
      # client script was never syntax-checked. A broken grid used to ship.
      - name: Syntax-check the dashboard's client script
        run: node tools/harness.js --check

      - name: Unit tests
        # Unquoted on purpose: the shell expands these into real paths.
        # node --test only learned to expand glob patterns itself in Node 22,
        # so a quoted pattern makes older runtimes look for a file literally
        # named "tests/*.test.js".
        run: node --test tests/*.test.js tests/*.test.mjs
